name: export-public
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export.yml"
      - "export_public.py"
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Export public data
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python export_public.py
      - name: Commit
        run: |
          git config user.name "bid-bot"
          git config user.email "bid-bot@users.noreply.github.com"
          git add docs/public.json
          git diff --cached --quiet || git commit -m "update public data"
          git pull --rebase
          git push
